name: manual-trigger-pipeline

on:
    workflow_dispatch:
        inputs:
            name:
                type: choice
                description: Who to greet
                options:
                - Twinkal
                - Megha
            message:
                required: true
            use-emoji:
                type: boolean
                description: Inclued 🎉🤣 emojis
            enviornment:
                type: environment

jobs:
    greet:
        runs-on: ubuntu-latest

        steps:
            - name: Send greeting
              run: echo "${{ github.event.inputs.message }}" ${{ fromJson('["","🥳"]')[github.event.inputs.use-emoji == 'true'] }} ${{ github.event.inputs.name }}